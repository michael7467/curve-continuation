description: fresco colours with all features and the a contrario test (support only for joins unlikely by chance)
dataset: datasets/frescoes_colour.yaml
compare:
  methods: [biarc, clothoid]
  ends: [curves, exact]
settings:
  score:
    matching:
      method: lap
    features:
      width: 2.0
      colour: 1.0
      curvature: 0.5
    significance:
      mode: nfa
      epsilon: 1.0
      tests: edge
