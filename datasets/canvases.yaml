# one closed curve per picture, around the picture centre
# r: the radius as a function of t (t from 0 to 2 pi), or circle: [cx, cy, r]; thickness in px
pictures:
  - name: canvas_01
    r: "187*(1 + 0.16*cos(3*t) + 0.07*sin(2*t + 0.6))"
    thickness: 7
  - name: canvas_02
    r: "235*150/sqrt((150*cos(t - 0.523599))**2 + (235*sin(t - 0.523599))**2)"
    thickness: 6
  - name: canvas_03
    r: "185*(1 + 0.12*cos(5*t + 0.3) + 0.05*cos(2*t))"
    thickness: 7
  - name: canvas_04
    r: "185/(cos(t - 0.261799)**4 + sin(t - 0.261799)**4)**0.25"
    thickness: 8
  - name: canvas_05
    r: "172*(1 + 0.30*cos(2*(t - 0.349066)))"
    thickness: 6
  - name: canvas_06
    r: "178*(1 + 0.18*cos(t - 1.047198) + 0.08*cos(2*(t - 1.047198)))"
    thickness: 7
  - name: canvas_07
    r: "185*(1 + 0.07*cos(8*t) + 0.04*sin(5*t))"
    thickness: 5
  - name: canvas_08
    r: "175*(1 + 0.22*cos(3*(t - 0.698132)))"
    thickness: 7
  - name: canvas_09
    circle: [335, 275, 190]
    thickness: 8
  - name: canvas_10
    r: "180*(1 + 0.0675*cos(2*t + 1.886) + 0.0838*cos(3*t + 5.4887) + 0.0765*cos(4*t + 0.0331) + 0.0435*cos(5*t + 5.1599))"
    thickness: 6
